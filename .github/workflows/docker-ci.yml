name: Docker Build & Container Health CI

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'ci/**'
      - 'fix/**'
      - 'member-*'
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose.yml'
      - '.dockerignore'
      - '.github/workflows/docker-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-compose-validate:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

  build-backend-image:
    name: Build & Healthcheck Backend Container
    needs: [docker-compose-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: spotshare-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke-test running Backend container
        run: |
          docker run -d --name spotshare-api-ci -p 8000:8000 spotshare-backend:ci
          trap "docker logs spotshare-api-ci || true; docker rm -f spotshare-api-ci || true" EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "Backend container is healthy!"
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/api/health
          echo ""
          curl -fsS http://127.0.0.1:8000/api/spots >/dev/null

  build-frontend-image:
    name: Build & Healthcheck Frontend Container
    needs: [docker-compose-validate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: spotshare-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Smoke-test running Frontend Nginx container
        run: |
          docker run -d --name spotshare-web-ci -p 8080:80 spotshare-frontend:ci
          trap "docker logs spotshare-web-ci || true; docker rm -f spotshare-web-ci || true" EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "Frontend container is healthy!"
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsS http://127.0.0.1:8080/host.html >/dev/null
          curl -fsS http://127.0.0.1:8080/showcase.html >/dev/null
          echo "Frontend Nginx serves index.html, host.html, and showcase.html cleanly!"
