name: SpotShare CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'ci/**'
      - 'fix/**'
      - 'member-*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend CI (Syntax, DB CLI Smoke & Pytest Suite)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (FastAPI + SQLite Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Python syntax check
        run: python -m compileall -q .

      - name: Database init & reset smoke test
        run: |
          SPOTSHARE_DB_PATH=/tmp/ci_db_smoke.db python database.py init
          SPOTSHARE_DB_PATH=/tmp/ci_db_smoke.db python database.py reset
          rm -f /tmp/ci_db_smoke.db

      - name: Run Pytest test suite
        run: python -m pytest test_backend.py -v

  # -------------------------------------------------------------
  # Job 2: Frontend CI (React 18 + Vite Multi-Page Build)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (React 18 + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Verify multi-page output bundles
        run: |
          test -f dist/index.html
          test -f dist/host.html
          test -f dist/showcase.html
          ls -lh dist/

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # -------------------------------------------------------------
  # Job 3: Full-Stack API Integration Smoke Test
  # -------------------------------------------------------------
  integration-smoke-test:
    name: Integration Smoke Test (Live FastAPI Server)
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI & verify live endpoints
        run: |
          export SPOTSHARE_DB_PATH=/tmp/integration_smoke.db
          uvicorn main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true; rm -f /tmp/integration_smoke.db" EXIT

          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "FastAPI server is up!"
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8000/api/health
          echo ""
          curl -fsS http://127.0.0.1:8000/api/spots >/dev/null
          curl -fsS "http://127.0.0.1:8000/api/recommendations?lat=12.3085&lng=76.6527&limit=3" >/dev/null
          curl -fsS http://127.0.0.1:8000/api/insights >/dev/null
          curl -fsS http://127.0.0.1:8000/docs >/dev/null
          echo "All live FastAPI endpoints passed HTTP 200 checks!"

  # -------------------------------------------------------------
  # Job 4: CD Pipeline (Deploy Frontend & Summary on main)
  # -------------------------------------------------------------
  cd-deploy:
    name: CD (Deploy to GitHub Pages)
    needs: [backend-ci, frontend-ci, integration-smoke-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Write CD Summary
        run: |
          echo "### SpotShare CI/CD Pipeline Completed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend Tests & Live Smoke:** Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend Bundle (\`index.html\`, \`host.html\`, \`showcase.html\`):** Built & Packaged" >> "$GITHUB_STEP_SUMMARY"
          echo "- **GitHub Pages URL:** ${{ steps.deployment.outputs.page_url || 'Enable Settings -> Pages -> GitHub Actions to publish live' }}" >> "$GITHUB_STEP_SUMMARY"
